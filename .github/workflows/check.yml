name: P-Bandai restock check

on:
  schedule:
    # 备胎，不是主力。主触发是 Cloudflare Worker，每小时 :23 打
    # workflow_dispatch API 过来（见 README「外部定时触发」）。
    #
    # GitHub 自己的 schedule 是 best-effort：高负载时不只是延迟，会直接把
    # 任务丢掉不跑。实测这个 repo，`0 * * * *` 是 0/5，`23 * * * *` 是 2/15。
    # 换个冷门分钟只能提高概率，治不了根，所以才加了外部触发。
    #
    # 设在 :53 而不是 :23，是为了跟 Cloudflare 错开半小时——真要靠它兜底时，
    # 覆盖间隔不会变成整整两小时。两边同时触发也没事，下面的 concurrency
    # 会让后到的那次排队等前一次跑完，不会两个一起 git push 打架。
    - cron: "53 * * * *"
  workflow_dispatch:        # Cloudflare Worker 和 Actions 页面手动运行都走这个

concurrency:
  group: pbandai-check
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit state/seen.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Node 24 runtimes. v4/v5 of these actions targeted Node 20, which is
      # deprecated and currently force-run on Node 24 with a warning.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_URLS: ${{ vars.WATCH_URLS }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # 没设就自动关闭
        run: python check.py

      - name: Commit updated state
        if: success()
        run: |
          git config user.name  "pbandai-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "state: update seen items [skip ci]"
            git push
          fi
