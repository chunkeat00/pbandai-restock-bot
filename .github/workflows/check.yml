name: P-Bandai restock check

on:
  # 唯一的触发方式：Cloudflare Worker 每 30 分钟调一次 workflow_dispatch API，
  # 三个 bot 轮流，彼此错开 5 分钟（时刻表和改频率的方法见 cloudflare/worker.js）。
  #
  # 以前这里还有一个 GitHub `schedule` 当备胎。2026-10-05 到 10-08 三天里，
  # 三个备胎合计跑了 34 次，没有一次是 Cloudflare 漏掉、靠它补上的，全是重复跑；
  # 它本身又经常迟到 25–40 分钟。所以拿掉了。Worker 或 PAT 出问题时，
  # 由 healthchecks 的掉线告警负责发现。
  workflow_dispatch:        # Cloudflare Worker 和 Actions 页面手动运行都走这个
    inputs:
      dry_run:
        # 手动排查用：Actions 页面 Run workflow 时勾上，只打印不发 Telegram，
        # 也不提交 state。Cloudflare 那边不带这个参数，默认就是 false。
        description: "Dry run：只打印，不发 Telegram、不提交 state"
        type: boolean
        default: false

concurrency:
  group: pbandai-check
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit state/seen.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Node 24 runtimes. v4/v5 of these actions targeted Node 20, which is
      # deprecated and currently force-run on Node 24 with a warning.
      #
      # ref 指定分支，checkout 拿的就是这个 job *开始跑时* 分支上的最新提交；
      # 不指定的话拿的是运行被*创建*时的提交。两次运行创建得很近时（手动
      # Run workflow 碰上定时那次、runner 排队），后到的那次虽然会排队等前一次
      # 跑完，却仍然从前一次之前的旧 state 开始比对：同一条补货会通知两遍，
      # push 时还会跟前一次的 state 提交冲突。
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 没有 pip install，也没有 Playwright/chromium。P-Bandai 的列表页 HTML 里
      # 直接嵌着完整的搜索结果 JSON（PRELOAD_DATA），标准库 urllib 就够了。
      # 一次运行从 ~75 秒降到 ~5 秒。

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_URLS: ${{ vars.WATCH_URLS }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # 没设就自动关闭
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python check.py

      - name: Commit updated state
        if: success() && !inputs.dry_run
        run: |
          git config user.name  "pbandai-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "state: update seen items [skip ci]"
          # 这个 repo 现在有两个 bot 在往 main 推 state（另一个是
          # kgb-check.yml）。抢输了是正常现象，不是错误——rebase 到对方的
          # 提交上面再试一次就好。
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          echo "push failed after 3 attempts" >&2
          exit 1
