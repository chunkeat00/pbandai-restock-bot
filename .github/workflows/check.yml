name: P-Bandai restock check

on:
  schedule:
    # Every hour at :23 (UTC).
    #
    # Deliberately NOT "0 * * * *". Scheduled workflows share one global queue
    # with every push and PR on GitHub, and the top of the hour is the worst
    # spike — runs queued then are delayed and, often enough, dropped entirely.
    # An off-peak minute is the single most effective fix. Any odd minute works;
    # :23 is just a quiet one.
    - cron: "23 * * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

concurrency:
  group: pbandai-check
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit state/seen.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Node 24 runtimes. v4/v5 of these actions targeted Node 20, which is
      # deprecated and currently force-run on Node 24 with a warning.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_URLS: ${{ vars.WATCH_URLS }}
        run: python check.py

      - name: Commit updated state
        if: success()
        run: |
          git config user.name  "pbandai-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "state: update seen items [skip ci]"
            git push
          fi
